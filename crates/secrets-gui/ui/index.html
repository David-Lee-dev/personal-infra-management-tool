<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Secrets</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>CLI 점검</h1>
        <button id="refresh" type="button">다시 검사</button>
      </header>

      <p class="lead">
        자격 증명을 다루려면 각 provider 의 CLI 가 필요합니다.
        여기서는 <strong>설치 여부만</strong> 봅니다 — 어느 계정으로 로그인돼 있는지는
        계정 화면에서 다룹니다.
      </p>

      <table>
        <thead>
          <tr>
            <th>도구</th>
            <th>경로</th>
            <th>필요 시점</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <p id="summary" class="summary"></p>
    </main>

    <!-- 이 앱이 실행하는 모든 외부 명령이 여기 그대로 보인다. -->
    <section id="terminal">
      <header class="term-head">
        <span class="term-label">터미널</span>
        <span id="term-status" class="term-status">대기 중</span>
        <button id="term-clear" type="button">지우기</button>
      </header>
      <pre id="term-body"></pre>
    </section>

    <script src="app.js"></script>
  </body>
</html>
