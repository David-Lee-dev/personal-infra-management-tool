<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Secrets</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
    <!-- 왼쪽 메뉴. 무엇을 보고 싶은지로 나눈다 — 저장 방식이 아니라. -->
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2 20 3"></path><path d="m16 7 3 3"></path></svg>
        </span>
        <span class="brand-text">
          <strong>인프라 콘솔</strong>
          <span>~/.secrets</span>
        </span>
      </div>

      <nav id="tabs" class="side-nav" aria-label="주 메뉴">
        <button type="button" data-tab="accounts">계정</button>
        <button type="button" data-tab="projects">프로젝트</button>
        <button type="button" data-tab="keys">자격 증명</button>
        <button type="button" data-tab="ssh">SSH 접속</button>
      </nav>

      <div class="side-gap"></div>

      <nav class="side-nav util" aria-label="도구">
        <button type="button" data-tab="env">도구 상태</button>
        <button type="button" id="open-jobs">작업 로그</button>
      </nav>
    </aside>

    <div class="workspace">
    <!-- 만료 임박 알림. 본문 위에 있어 어느 화면에서도 보인다. -->
    <div id="alerts" hidden></div>

    <main>
      <!-- SSH 접속 ──────────────────────────────────────── -->
      <section id="tab-ssh" class="page wide" hidden>
        <div id="ssh-body" class="project-body"></div>
      </section>

      <!-- 프로젝트 ─────────────────────────────────────── -->
      <section id="tab-projects" class="page wide" hidden>
        <div id="project-body" class="project-body"></div>
      </section>

      <!-- 환경 구성 ─────────────────────────────────── -->
      <section id="tab-env" class="page" hidden>
        <div class="bar">
          <p id="summary" class="summary"></p>
          <button id="refresh" type="button">다시 검사</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>도구</th>
              <th>버전</th>
              <th>경로</th>
              <th>필요 시점</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <!-- 계정 관리 ─────────────────────────────────── -->
      <section id="tab-accounts" class="page wide" hidden>
        <div class="master">
          <!-- 레일: provider 로 묶인 계정 목록 -->
          <aside id="rail" class="rail"></aside>

          <!-- 상세: 선택한 계정 · 추가 폼 · 빈 안내가 번갈아 들어선다 -->
          <div id="detail" class="detail"></div>
        </div>

        <!-- 상세 칸에 복제해 쓰는 폼 원본 -->
        <template id="tpl-form">
          <form class="account-form" autocomplete="off">
            <div class="detail-head">
              <div class="detail-title-wrap">
                <span class="cap">새 계정</span>
                <h2 id="f-title">계정 연결</h2>
              </div>
            </div>

            <div class="detail-body">
              <p id="f-guidance" class="guidance"></p>
              <div id="f-fields"></div>

              <div class="form-row">
                <button id="f-browser" type="button" hidden></button>
                <button id="f-probe" type="button">자격 확인</button>
              </div>

              <!-- 코드를 받아 와야 끝나는 로그인의 중간 단계 -->
              <div id="f-challenge" class="challenge" hidden>
                <ol class="steps">
                  <li>
                    브라우저 페이지에 이 세션 ID가 보이는지 확인합니다.
                    <span class="session-line">
                      <span id="f-session" class="session-id"></span>
                      <span class="session-hint">브라우저에 표시된 세션 ID와 비교하세요. 입력할 필요는 없습니다.</span>
                    </span>
                  </li>
                  <li>Google 계정으로 로그인합니다.</li>
                  <li>로그인을 마치면 페이지에 표시되는 <strong>인증 코드</strong>를 복사합니다.</li>
                </ol>
                <div class="field">
                  <label for="f-code">인증 코드</label>
                  <input id="f-code" type="text" autocomplete="off" spellcheck="false"
                         placeholder="로그인 후 페이지에 표시되는 긴 문자열" />
                  <span class="field-help">
                    세션 ID가 아닙니다. 로그인을 마쳐야 나오며, 몇 분 뒤 만료됩니다.
                  </span>
                </div>
                <div class="form-row">
                  <button id="f-open-auth" type="button">인증 페이지 열기</button>
                  <button id="f-code-submit" type="button">코드로 로그인 완료</button>
                  <button id="f-restart" type="button" class="quiet">다시 시작</button>
                </div>
              </div>

              <!-- 확인된 사실. 이름과 만료일은 여기서 읽어 오므로 입력칸이 없다. -->
              <div id="f-identity" class="identity" hidden></div>

              <div class="field">
                <label for="f-display">설명</label>
                <input id="f-display" type="text"
                       placeholder="계정의 용도와 소유자를 입력하세요" />
                <span class="field-help">
                  이 칸만 직접 적습니다. 나머지는 자격에서 읽어 옵니다.
                  나중에 이 계정이 무엇이었는지 알아볼 수 있게 써 두세요.
                </span>
              </div>
            </div>

            <div class="detail-actions">
              <p id="f-error" class="problem" hidden></p>
              <button id="f-cancel" type="button">취소</button>
              <button id="f-submit" type="submit">연결</button>
            </div>
          </form>
        </template>
      </section>

      <!-- 키 관리 ─────────────────────────────────────── -->
      <section id="tab-keys" class="page wide" hidden>
        <!-- 도메인이 안쪽 탭이 된다. 키는 도메인 하나에 몰려 레일이 빈다. -->
        <nav id="key-domains" class="inner-tabs">
          <div class="segmented" role="tablist">
            <button role="tab" type="button" data-domain="github" aria-selected="true">GitHub 배포 키</button>
            <button role="tab" type="button" data-domain="iam" aria-selected="false">AWS IAM</button>
            <button role="tab" type="button" data-domain="pem" aria-selected="false">서버 키</button>
            <button role="tab" type="button" data-domain="etc" aria-selected="false">기타</button>
          </div>
          <span class="inner-tabs-gap"></span>
          <!-- 탭마다 다른 버튼. 목록을 보고 있을 때만 보인다. -->
          <span id="key-actions" class="row-actions"></span>
        </nav>

        <!-- 목록 · 상세 · 만들기가 번갈아 들어선다 -->
        <div id="key-body" class="key-body"></div>
      </section>
    </main>

    <!-- 터미널 높이 조절 손잡이. 경계선 자체를 잡아 끈다. -->
    <div id="splitter" role="separator" aria-orientation="horizontal" tabindex="0"
         aria-label="터미널 높이 조절"></div>

    <!-- 이 앱이 실행하는 모든 외부 명령이 여기 그대로 남는다. 평소에는 한 줄로 접혀
         상태만 보이고, 펼치면 전부 보인다. -->
    <section id="terminal" class="collapsed">
      <header class="term-head">
        <button id="term-toggle" type="button" class="term-toggle" aria-expanded="false" aria-controls="term-body">
          <span class="term-light" aria-hidden="true"></span>
          <span class="term-label">작업</span>
        </button>
        <span id="term-status" class="term-status">대기 중</span>
        <button id="term-clear" type="button">지우기</button>
        <span class="term-key" aria-hidden="true">⌃`</span>
      </header>
      <pre id="term-body"></pre>
    </section>
    </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
