<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Secrets</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav id="tabs" role="tablist">
      <button role="tab" type="button" data-tab="env" aria-selected="true">환경 구성</button>
      <button role="tab" type="button" data-tab="accounts" aria-selected="false">계정 관리</button>
    </nav>

    <main>
      <!-- 환경 구성 ─────────────────────────────────── -->
      <section id="tab-env" role="tabpanel" class="page">
        <div class="bar">
          <p id="summary" class="summary"></p>
          <button id="refresh" type="button">다시 검사</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>도구</th>
              <th>버전</th>
              <th>경로</th>
              <th>필요 시점</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <!-- 계정 관리 ─────────────────────────────────── -->
      <section id="tab-accounts" role="tabpanel" class="page wide" hidden>
        <div class="master">
          <!-- 레일: provider 로 묶인 계정 목록 -->
          <aside id="rail" class="rail"></aside>

          <!-- 상세: 선택한 계정 · 추가 폼 · 빈 안내가 번갈아 들어선다 -->
          <div id="detail" class="detail"></div>
        </div>

        <!-- 상세 칸에 복제해 쓰는 폼 원본 -->
        <template id="tpl-form">
          <form class="account-form" autocomplete="off">
            <div class="detail-head">
              <div class="detail-title-wrap">
                <span class="cap">새 계정</span>
                <h2>계정 연결</h2>
              </div>
            </div>

            <div class="detail-body">
              <div class="field-row">
                <div class="field">
                  <label for="f-provider">provider</label>
                  <select id="f-provider">
                    <option value="github">GitHub</option>
                    <option value="aws">AWS</option>
                    <option value="gcloud">Google Cloud</option>
                    <option value="firebase">Firebase</option>
                  </select>
                </div>
                <div class="field">
                  <label for="f-owner">소유</label>
                  <select id="f-owner">
                    <option value="unknown">모름</option>
                    <option value="self">내 소유</option>
                    <option value="external">외부 조직에서 받음</option>
                  </select>
                  <span class="field-help">외부 조직 계정은 자격을 직접 발급할 수 없습니다.</span>
                </div>
              </div>

              <div class="field-row">
                <div class="field">
                  <label for="f-slug">이름</label>
                  <input id="f-slug" type="text" placeholder="personal, tuk-prod" />
                  <span class="field-help">소문자·숫자·하이픈. 나중에 바꿀 수 없습니다.</span>
                </div>
                <div class="field">
                  <label for="f-display">설명</label>
                  <input id="f-display" type="text" placeholder="개인 계정" />
                </div>
              </div>

              <hr class="rule" />

              <p id="f-guidance" class="guidance"></p>
              <div id="f-fields"></div>
              <button id="f-browser" type="button" hidden></button>
            </div>

            <div class="detail-actions">
              <p id="f-error" class="problem" hidden></p>
              <button id="f-cancel" type="button">취소</button>
              <button id="f-submit" type="submit">연결</button>
            </div>
          </form>
        </template>
      </section>
    </main>

    <!-- 터미널 높이 조절 손잡이. 경계선 자체를 잡아 끈다. -->
    <div id="splitter" role="separator" aria-orientation="horizontal" tabindex="0"
         aria-label="터미널 높이 조절"></div>

    <!-- 이 앱이 실행하는 모든 외부 명령이 여기 그대로 보인다. -->
    <section id="terminal">
      <header class="term-head">
        <span class="term-label">터미널</span>
        <span id="term-status" class="term-status">대기 중</span>
        <button id="term-clear" type="button">지우기</button>
      </header>
      <pre id="term-body"></pre>
    </section>

    <script src="app.js"></script>
  </body>
</html>
