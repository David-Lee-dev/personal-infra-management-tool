<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Secrets</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 만료 임박 알림. 탭 위에 있어 어느 화면에서도 보인다. -->
    <div id="alerts" hidden></div>

    <nav id="tabs" role="tablist">
      <button role="tab" type="button" data-tab="env" aria-selected="true">환경 구성</button>
      <button role="tab" type="button" data-tab="accounts" aria-selected="false">계정 관리</button>
    </nav>

    <main>
      <!-- 환경 구성 ─────────────────────────────────── -->
      <section id="tab-env" role="tabpanel" class="page">
        <div class="bar">
          <p id="summary" class="summary"></p>
          <button id="refresh" type="button">다시 검사</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>도구</th>
              <th>버전</th>
              <th>경로</th>
              <th>필요 시점</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <!-- 계정 관리 ─────────────────────────────────── -->
      <section id="tab-accounts" role="tabpanel" class="page wide" hidden>
        <div class="master">
          <!-- 레일: provider 로 묶인 계정 목록 -->
          <aside id="rail" class="rail"></aside>

          <!-- 상세: 선택한 계정 · 추가 폼 · 빈 안내가 번갈아 들어선다 -->
          <div id="detail" class="detail"></div>
        </div>

        <!-- 상세 칸에 복제해 쓰는 폼 원본 -->
        <template id="tpl-form">
          <form class="account-form" autocomplete="off">
            <div class="detail-head">
              <div class="detail-title-wrap">
                <span class="cap">새 계정</span>
                <h2 id="f-title">계정 연결</h2>
              </div>
            </div>

            <div class="detail-body">
              <p id="f-guidance" class="guidance"></p>
              <div id="f-fields"></div>

              <div class="form-row">
                <button id="f-browser" type="button" hidden></button>
                <button id="f-probe" type="button">자격 확인</button>
              </div>

              <!-- 코드를 받아 와야 끝나는 로그인의 중간 단계 -->
              <div id="f-challenge" class="challenge" hidden>
                <p class="challenge-note">
                  브라우저에서 로그인하면 코드가 나옵니다. 그 코드를 아래에 붙여넣으세요.
                  코드는 몇 분 안에 만료됩니다.
                </p>
                <div class="field">
                  <label for="f-code">인증 코드</label>
                  <input id="f-code" type="text" autocomplete="off" spellcheck="false" />
                </div>
                <div class="form-row">
                  <button id="f-open-auth" type="button">인증 페이지 열기</button>
                  <button id="f-code-submit" type="button">코드로 완료</button>
                  <button id="f-restart" type="button" class="quiet">다시 시작</button>
                </div>
              </div>

              <!-- 확인된 사실. 이름과 만료일은 여기서 읽어 오므로 입력칸이 없다. -->
              <div id="f-identity" class="identity" hidden></div>

              <div class="field">
                <label for="f-display">설명</label>
                <input id="f-display" type="text"
                       placeholder="무엇에 쓰는 계정인지, 누구 소유인지" />
                <span class="field-help">
                  이 칸만 직접 적습니다. 나머지는 자격에서 읽어 옵니다.
                  나중에 이 계정이 무엇이었는지 알아볼 수 있게 써 두세요.
                </span>
              </div>
            </div>

            <div class="detail-actions">
              <p id="f-error" class="problem" hidden></p>
              <button id="f-cancel" type="button">취소</button>
              <button id="f-submit" type="submit">연결</button>
            </div>
          </form>
        </template>
      </section>
    </main>

    <!-- 터미널 높이 조절 손잡이. 경계선 자체를 잡아 끈다. -->
    <div id="splitter" role="separator" aria-orientation="horizontal" tabindex="0"
         aria-label="터미널 높이 조절"></div>

    <!-- 이 앱이 실행하는 모든 외부 명령이 여기 그대로 보인다. -->
    <section id="terminal">
      <header class="term-head">
        <span class="term-label">터미널</span>
        <span id="term-status" class="term-status">대기 중</span>
        <button id="term-clear" type="button">지우기</button>
      </header>
      <pre id="term-body"></pre>
    </section>

    <script src="app.js"></script>
  </body>
</html>
