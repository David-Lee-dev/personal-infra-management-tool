# core 는 도메인과 포트만 가진다. 프로세스·파일시스템·환경변수·시계는
# secrets-local 의 몫이고, 여기서는 포트 뒤에 있어야 한다.
#
# 의존성 그래프만으로는 이것을 막지 못한다. std 는 의존성 없이도 쓸 수 있다.
# 그래서 이름 해석 뒤의 정의를 보고 막는다.
#
# clippy 는 이 파일을 빌드 중인 패키지의 manifest 디렉토리에서 찾으므로
# secrets-local 에는 적용되지 않는다. CLIPPY_CONF_DIR 을 설정하면 이 규칙이
# 통째로 덮여 사라지므로 쓰지 않는다.

disallowed-types = [
  { path = "std::process::Command", reason = "프로세스 실행은 secrets-local 의 몫이다" },
  { path = "std::process::Child", reason = "프로세스 실행은 secrets-local 의 몫이다" },
  { path = "std::fs::File", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::OpenOptions", reason = "파일 접근은 포트 뒤에 둔다" },
]

disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "지금이 언제인지는 Clock 포트가 말한다" },
  { path = "std::env::var", reason = "환경변수는 secrets-local 의 몫이다" },
  { path = "std::env::var_os", reason = "환경변수는 secrets-local 의 몫이다" },

  { path = "std::fs::read", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::read_to_string", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::read_dir", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::write", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::rename", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::copy", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::remove_file", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::remove_dir_all", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::create_dir", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::create_dir_all", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::metadata", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::symlink_metadata", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::fs::set_permissions", reason = "파일 접근은 포트 뒤에 둔다" },

  { path = "std::path::Path::exists", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::path::Path::is_file", reason = "파일 접근은 포트 뒤에 둔다" },
  { path = "std::path::Path::is_dir", reason = "파일 접근은 포트 뒤에 둔다" },
]
